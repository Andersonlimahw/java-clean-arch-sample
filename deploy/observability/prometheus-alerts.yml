groups:
  - name: payments-platform
    rules:
      - alert: OutboxPendingHigh
        expr: payments_outbox_pending > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Outbox backlog is above 100 unpublished events
          description: The relay is not keeping up with commits. Check RabbitMQ and payments.outbox.lag.seconds.

      - alert: OutboxLagHigh
        expr: payments_outbox_lag_seconds > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Oldest unpublished outbox event is older than 60 seconds
          description: SLO for publish lag is 30 seconds. Investigate the relay and broker confirms.

      - alert: NotificationDlqNotEmpty
        expr: payments_queue_messages{role="dlq"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Notification DLQ has messages
          description: Permanent or exhausted failures need an operator. Do not claim they were processed.

      - alert: ApiErrorRateHigh
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
            sum(rate(http_server_requests_seconds_count[5m]))
          ) > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: HTTP 5xx ratio is above 1%
          description: Availability SLO is 99.5% over 30 days. This is an early signal, not the SLO itself.
