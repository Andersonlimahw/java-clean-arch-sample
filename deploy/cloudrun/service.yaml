apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: payments-platform
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/vpc-access-connector: PROJECT_CONNECTOR
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/payments-platform:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: JWT_ISSUER
              value: https://api.payments.muse.com
            - name: JWT_AUDIENCE
              value: payments-api
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: payments-db-url
                  key: latest
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: payments-db-user
                  key: latest
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payments-db-password
                  key: latest
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: payments-redis-host
                  key: latest
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: payments-redis-port
                  key: latest
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payments-redis-password
                  key: latest
            - name: RABBITMQ_HOST
              valueFrom:
                secretKeyRef:
                  name: payments-rabbitmq-host
                  key: latest
            - name: RABBITMQ_PORT
              valueFrom:
                secretKeyRef:
                  name: payments-rabbitmq-port
                  key: latest
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: payments-rabbitmq-user
                  key: latest
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payments-rabbitmq-password
                  key: latest
            - name: RABBITMQ_VHOST
              valueFrom:
                secretKeyRef:
                  name: payments-rabbitmq-vhost
                  key: latest
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: payments-jwt-private-key
                  key: latest
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: payments-jwt-public-key
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
