apiVersion: batch/v1
kind: Job
metadata:
  name: payments-flyway-migration
  namespace: payments-system
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flyway-migration
          image: payments-platform:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: payments-config
            - secretRef:
                name: payments-secret
          env:
            # ConfigMap sets SPRING_FLYWAY_ENABLED=false for replicas. This entry overrides
            # that for the Job. The application also forces Flyway on, skips HTTP and
            # consumers, and exits 0 only after migrations are applied.
            - name: SPRING_FLYWAY_ENABLED
              value: "true"
            - name: APP_MIGRATION_ONLY
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /tmp
              name: tmp-volume
      volumes:
        - name: tmp-volume
          emptyDir: {}
