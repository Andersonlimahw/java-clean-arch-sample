apiVersion: batch/v1
kind: Job
metadata:
  name: payments-flyway-migration
  namespace: payments-system
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: flyway-migration
          image: payments-platform:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: payments-config
            - secretRef:
                name: payments-secret
          env:
            - name: SPRING_FLYWAY_ENABLED
              value: "true"
            # PaymentsApplication adds the migration profile and exits after Flyway.
            # The Deployment keeps SPRING_FLYWAY_ENABLED=false so replicas do not migrate.
            - name: APP_MIGRATION_ONLY
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
