apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payments-network-policy
  namespace: payments-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: payments-platform
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - {}
