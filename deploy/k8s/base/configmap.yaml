apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-config
  namespace: payments-system
data:
  SPRING_PROFILES_ACTIVE: "prod"
  PORT: "8080"
  JWT_ISSUER: "https://api.payments.muse.com"
  JWT_AUDIENCE: "payments-api"
  ACCESS_TOKEN_TTL: "PT15M"
  REFRESH_TOKEN_TTL: "P7D"
  SPRING_FLYWAY_ENABLED: "false"
  # Replace with the real provider. Profile prod rejects a missing value and any non-https URL.
  FRAUD_SCREENING_BASE_URL: "https://fraud-screening.payments.svc.cluster.local"
