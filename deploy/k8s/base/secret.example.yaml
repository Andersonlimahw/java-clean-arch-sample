apiVersion: v1
kind: Secret
metadata:
  name: payments-secret
  namespace: payments-system
type: Opaque
stringData:
  DB_URL: "jdbc:postgresql://db.managed.internal:5432/payments"
  DB_USER: "postgres_prod"
  DB_PASSWORD: "CHANGE_ME_PASSWORD"
  REDIS_HOST: "redis.managed.internal"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"
  RABBITMQ_HOST: "rabbitmq.managed.internal"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "app_user"
  RABBITMQ_PASSWORD: "CHANGE_ME_RABBITMQ_PASSWORD"
  RABBITMQ_VHOST: "/"
  JWT_PRIVATE_KEY: "CHANGE_ME"
  JWT_PUBLIC_KEY: "CHANGE_ME"
  # Add FRAUD_SCREENING_BASE_URL with the real provider https URL.
  # Leave it unset until that URL exists. A stand-in URL is not a valid value.
