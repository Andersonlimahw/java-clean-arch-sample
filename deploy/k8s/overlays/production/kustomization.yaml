apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: payments-production

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: payments-deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Ingress
      name: payments-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.payments.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.payments.example.com
