name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version-file: .java-version
          distribution: 'temurin'
          cache: maven

      - name: Validate Documentation and AI Tooling
        run: |
          bash scripts/validate-docs.sh
          python3 -I scripts/validate-ai-tooling.py

      - name: Build and Test with Maven
        run: mvn -B clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: payments-platform:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Container Image with Trivy
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: 'payments-platform:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.debug.yml config > /dev/null

      - name: Validate Kubernetes Manifests with Kubeconform
        run: |
          # ghcr.io/yannh/kubeconform is distroless: it has neither /bin/sh nor kustomize.
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" | tar -xz -C /tmp
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" | tar -xz -C /tmp
          /tmp/kustomize build deploy/k8s/overlays/staging | /tmp/kubeconform -strict -kubernetes-version 1.30.0 -summary
          /tmp/kustomize build deploy/k8s/overlays/production | /tmp/kubeconform -strict -kubernetes-version 1.30.0 -summary
