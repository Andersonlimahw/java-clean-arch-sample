# Opt-in profile for a developer machine. The Compose fraud-screening service publishes CLEAR on port 8090.
# Activate with spring.profiles.active=local. The base file remains the default.
app:
  fraud-screening:
    base-url: ${FRAUD_SCREENING_BASE_URL:http://localhost:8090}
    connect-timeout: 500ms
    read-timeout: 5s

resilience4j:
  circuitbreaker:
    instances:
      fraudScreening:
        sliding-window-size: 16
        minimum-number-of-calls: 16
        failure-rate-threshold: 60
        wait-duration-in-open-state: 10s
  bulkhead:
    instances:
      fraudScreening:
        max-concurrent-calls: 8
  retry:
    instances:
      fraudScreening:
        max-attempts: 4
        wait-duration: 250ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
  timelimiter:
    instances:
      fraudScreening:
        timeout-duration: 2s
