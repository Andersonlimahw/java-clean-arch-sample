spring:
  application:
    name: payments-platform
  threads:
    virtual:
      enabled: true
  task:
    scheduling:
      pool:
        # Applied only when virtual threads are off (ThreadPoolTaskScheduler).
        # With spring.threads.virtual.enabled, Boot registers SimpleAsyncTaskScheduler.
        size: 2
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Session advisory lock so CREATE INDEX CONCURRENTLY is not inside a transaction.
    postgresql:
      transactional-lock: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
    publisher-confirm-type: correlated
    publisher-returns: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Tomcat RemoteIpValve. X-Forwarded-For changes the remote address only when the
  # immediate peer matches server.tomcat.remoteip.internal-proxies (private ranges).
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      # Base URL (OTEL spec) or full traces URL. OtlpEndpointNormalizer appends /v1/traces when missing.
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      slo:
        http.server.requests: 100ms,300ms,500ms,1s

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"

app:
  security:
    # BCrypt work factor (4-31). 10 (~60-80ms) balances OWASP recommendations and interactive API latency.
    # Override via BCRYPT_COST=12 when stricter compliance is required.
    bcrypt-cost: ${BCRYPT_COST:10}
    # Platform threads that run BCrypt, so hashing does not occupy virtual-thread carriers.
    # 0 means availableProcessors() - 1 (minimum 1).
    password-hashing-threads: ${PASSWORD_HASHING_THREADS:0}
    expose-public-docs-and-metrics: ${EXPOSE_PUBLIC_DOCS_AND_METRICS:true}
    auth-ip-max-requests-per-minute: ${AUTH_IP_RATE_LIMIT_PER_MINUTE:20}
    auth-account-max-requests-per-minute: ${AUTH_ACCOUNT_RATE_LIMIT_PER_MINUTE:15}
  payments:
    write-max-requests-per-minute: ${PAYMENT_WRITE_RATE_LIMIT_PER_MINUTE:120}
  retention:
    cleanup-interval-ms: ${RETENTION_CLEANUP_INTERVAL_MS:3600000}
    published-outbox-ttl: ${PUBLISHED_OUTBOX_RETENTION:P7D}
    processed-events-ttl: ${PROCESSED_EVENTS_RETENTION:P30D}
    expired-refresh-tokens-ttl: ${EXPIRED_REFRESH_TOKENS_RETENTION:P7D}
  idempotency:
    cleanup-interval-ms: 3600000
    # In-flight lease only. Completion extends the row to 24h. Long enough for screening plus persist.
    processing-ttl: 2m
  jwt:
    issuer: ${JWT_ISSUER:https://api.payments.muse.com}
    audience: ${JWT_AUDIENCE:payments-api}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P7D}
    key-id: ${JWT_KEY_ID:payments-jwt-key-v1}
    private-key-pem: ${JWT_PRIVATE_KEY:}
    public-key-pem: ${JWT_PUBLIC_KEY:}
    previous-key-id: ${JWT_PREVIOUS_KEY_ID:payments-jwt-key-v0}
    previous-public-key-pem: ${JWT_PREVIOUS_PUBLIC_KEY:}
  # Crypto-shredding KEK (ADR 0020). 32 random bytes, base64. Required on prod; blank elsewhere
  # means an ephemeral per-JVM KEK. Never commit a value.
  lgpd:
    kek-base64: ${LGPD_KEK_BASE64:}
    kek-id: ${LGPD_KEK_ID:lgpd-kek-v1}
    previous-kek-base64: ${LGPD_PREVIOUS_KEK_BASE64:}
    previous-kek-id: ${LGPD_PREVIOUS_KEK_ID:lgpd-kek-v0}
  messaging:
    listener-max-attempts: ${LISTENER_MAX_ATTEMPTS:5}
    listener-initial-interval-ms: ${LISTENER_INITIAL_INTERVAL_MS:500}
    listener-multiplier: ${LISTENER_MULTIPLIER:2.0}
    listener-max-interval-ms: ${LISTENER_MAX_INTERVAL_MS:10000}
    confirm-timeout: ${PUBLISH_CONFIRM_TIMEOUT:5s}
  fraud-screening:
    base-url: ${FRAUD_SCREENING_BASE_URL:http://localhost:8090}
    connect-timeout: 300ms
    # Longer than the time limiter so a cancelled attempt is released by interrupt, not by this timeout.
    read-timeout: 3s
  psp:
    default-provider: ${PSP_DEFAULT_PROVIDER:stripe}
    stripe:
      enabled: ${STRIPE_ENABLED:true}
      base-url: ${STRIPE_BASE_URL:http://localhost:12111}
      api-key: ${STRIPE_API_KEY:sk_test_local}
      # Well-known local default only. Startup fails on the prod profile while it is unchanged.
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_local_dev_only}
      # Replay window; Stripe's own libraries default to five minutes.
      webhook-tolerance: ${STRIPE_WEBHOOK_TOLERANCE:5m}
      connect-timeout: 300ms
      read-timeout: 3s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Instance name fraudScreening is fixed in HttpFraudScreeningAdapter and is the Micrometer tag.
# Retry wraps the circuit breaker, so each attempt is one circuit-breaker call.
# minimum-number-of-calls stays at least max-attempts so one screening cannot open the circuit.
# Only timeout, 5xx, 408, 429, and I/O are retried. An explicit decline is not an exception.
resilience4j:
  circuitbreaker:
    instances:
      fraudScreening:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 12
        minimum-number-of-calls: 12
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: false
        record-exceptions:
          - java.util.concurrent.TimeoutException
          - java.util.concurrent.RejectedExecutionException
          - org.springframework.web.client.ResourceAccessException
          - com.muse.payments.payments.infrastructure.fraud.FraudTransientException
        ignore-exceptions:
          - java.lang.InterruptedException
          - io.github.resilience4j.bulkhead.BulkheadFullException
  bulkhead:
    instances:
      fraudScreening:
        max-concurrent-calls: 25
        max-wait-duration: 0
  retry:
    instances:
      fraudScreening:
        max-attempts: 3
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        fail-after-max-attempts: false
        retry-exceptions:
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException
          - com.muse.payments.payments.infrastructure.fraud.FraudTransientException
        ignore-exceptions:
          - java.lang.InterruptedException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - io.github.resilience4j.bulkhead.BulkheadFullException
  timelimiter:
    instances:
      fraudScreening:
        timeout-duration: 800ms
        cancel-running-future: true
