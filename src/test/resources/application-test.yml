spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    listener:
      simple:
        missing-queues-fatal: false
        retry:
          enabled: false

management:
  tracing:
    enabled: false
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false

app:
  outbox:
    scheduling:
      enabled: false
  jwt:
    issuer: https://test.payments.muse.com
    audience: payments-api-test
    access-token-ttl: PT5M
    refresh-token-ttl: P1D
