management.tracing.enabled=false
# Tests call the relay directly. A live poller would publish rows the assertions still own.
app.outbox.scheduling.enabled=false
# Full Spring tests do not call a fraud provider. The HTTP adapter stays the bean when mode=http.
app.fraud-screening.mode=stub
# No PSP in the shared test context. PspWebhookIT enables Stripe and points it at WireMock.
app.psp.stripe.enabled=false
